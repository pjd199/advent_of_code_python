name: Compatability Check

on:
  workflow_dispatch:

  pull_request:
    types: [opened, edited, reopened]

  push:
    branches:
      - main

concurrency:
  group: compatability${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compatability Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out Respository
        uses: actions/checkout@v3

      - name: Setup up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display python version
        run: python --version

      - uses: actions/cache@v4
        name: Load package cache
        id: package-cache
        with:
          path: ${{ env.pythonLocation }}
          key: pyproject.toml-${{ env.pythonLocation }}-${{ matrix.python-version }}-${{hashFiles('pyproject.toml') }}

      - name: Install package
        if: steps.package-cache.outputs.cache-hit != 'true'
        run: pip install --editable .[dev]

      - uses: actions/cache@v4
        name: Load pre-commit cache
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.pythonLocation }}-${{ env.PYTHON_VERSION }}-${{hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

      - name: Testing with pytest
        if: ${{ always() }}
        run: |
          pytest ./tests/unit ./tests/integration -n auto
